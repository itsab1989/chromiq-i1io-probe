name: Build probe bundles

# Produces ready-to-run binaries (no Python needed) for Windows, Linux, and both
# Intel and Apple-Silicon macs. Push a version tag (e.g. v1.1.0) to build them
# and publish a GitHub Release with all of them attached. workflow_dispatch just
# builds them as downloadable run artifacts for testing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            asset: chromiq-io-probe-linux
            universal: false
          - os: windows-latest
            asset: chromiq-io-probe-windows.exe
            universal: false
          # One fat binary that runs on both Intel and Apple-Silicon macs.
          - os: macos-latest
            asset: chromiq-io-probe-macos
            universal: true
    steps:
      - uses: actions/checkout@v4

      # Linux / Windows: a normal single-arch Python is fine.
      - uses: actions/setup-python@v5
        if: matrix.universal == false
        with:
          python-version: "3.12"

      # macOS: use the python.org universal2 build so PyInstaller can emit a
      # universal2 (x86_64 + arm64) binary, the same approach ChromIQ uses.
      # This script is pure standard library, so there are no third-party
      # wheels to fatten; --target-arch universal2 is all that's needed.
      - name: Set up universal2 Python (macOS)
        if: matrix.universal == true
        run: |
          curl -fsSL -o /tmp/python.pkg \
            "https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg"
          sudo installer -pkg /tmp/python.pkg -target /
          echo "/Library/Frameworks/Python.framework/Versions/3.12/bin" >> "$GITHUB_PATH"

      # Standard library only, so the tests need nothing installed. A red
      # test stops the build, and with it the release.
      - name: Run the tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY -m unittest discover -s tests -v

      - name: Install PyInstaller
        run: python3 -m pip install --upgrade pip pyinstaller

      - name: Build one-file executable
        shell: bash
        run: |
          if [ "${{ matrix.universal }}" = "true" ]; then
            pyinstaller --onefile --target-arch universal2 --name probe chromiq_io_probe.py
          else
            pyinstaller --onefile --name probe chromiq_io_probe.py
          fi

      - name: Name the artifact
        shell: bash
        run: |
          mkdir -p out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/probe.exe "out/${{ matrix.asset }}"
          else
            mv dist/probe "out/${{ matrix.asset }}"
            chmod +x "out/${{ matrix.asset }}"
          fi

      - name: Verify it really is universal2 (macOS)
        if: matrix.universal == true
        run: |
          lipo -info "out/${{ matrix.asset }}"
          lipo -info "out/${{ matrix.asset }}" | grep -q "x86_64 arm64" \
            || { echo "FAIL: binary is not universal2"; exit 1; }

      - name: Smoke-test the binary (must run and exit 0)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          # With no device and stdin closed it must still produce a report and
          # exit cleanly. A binary that crashes here is not shippable.
          # The report is written next to the executable (i.e. in out/).
          "./out/${{ matrix.asset }}" --skip-annotate < /dev/null
          if ls out/chromiq-io-probe-*.txt >/dev/null 2>&1; then
            echo "report written OK"
          else
            echo "FAIL: no report produced"; exit 1
          fi

      - name: Smoke-test the binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $null | & ".\out\${{ matrix.asset }}" --skip-annotate
          if (Get-ChildItem "out\chromiq-io-probe-*.txt" -ErrorAction SilentlyContinue) {
            Write-Host "report written OK"
          } else {
            Write-Error "no report produced"; exit 1
          }

      # 1.5: the frozen binary must read a (synthetic) i1Pro 2 recording.
      - name: Smoke-test the analyser in the binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then PY=python; else PY=python3; fi
          mkdir -p smoke
          $PY -c "import os,sys; sys.path.insert(0,'tests'); import synth; synth.i1pro2_session_files('smoke', os)"
          "./out/${{ matrix.asset }}" --analyze smoke/scan-single.pcap smoke/noruler.pcap > smoke/analysis.txt
          cat smoke/analysis.txt | tail -20
          grep -q "instrument family: i1Pro 2 (Rev E)" smoke/analysis.txt
          grep -q "0xD7 sent" smoke/analysis.txt
          grep -q "NOT USED BY THE OPEN DRIVER" smoke/analysis.txt

      # 1.5.4: the tool says it needs Python 3.8 or newer; prove it.
      - uses: actions/setup-python@v5
        if: matrix.os == 'ubuntu-22.04'
        id: py38
        with:
          python-version: "3.8"
      - name: Run the tests on Python 3.8
        if: matrix.os == 'ubuntu-22.04'
        run: ${{ steps.py38.outputs.python-path }} -m unittest discover -s tests

      # 1.5.4: and a (synthetic) i1iO table recording made on a Mac.
      - name: Smoke-test the i1iO analysis in the binary
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then PY=python; else PY=python3; fi
          $PY -c "import sys; sys.path.insert(0,'tests'); import synth_io as s; w=s.DarwinWriter(); s.table_session(w); w.save('smoke/io-table.pcap')"
          "./out/${{ matrix.asset }}" --analyze smoke/io-table.pcap > smoke/io.txt
          tail -20 smoke/io.txt
          grep -q "THE i1iO TABLE" smoke/io.txt
          grep -q "every line checks out" smoke/io.txt
          grep -q "<serial>" smoke/io.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Also bundle the readable scripts (for people who prefer source)
        run: |
          pack="chromiq-i1io-probe-scripts"
          mkdir -p "$pack"
          cp chromiq_io_probe.py "READ ME FIRST.txt" README.md \
             Start-macOS.command Start-Linux.sh Start-Windows.bat "$pack/"
          zip -r "artifacts/${pack}.zip" "$pack"
          ls -la artifacts

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: |
            Ready-to-run builds of the ChromIQ X-Rite instrument information
            collector: for the i1iO table and, since 1.5, for handheld
            instruments (i1Pro, i1Pro 2, i1Pro 3 / 3 Plus, ColorMunki, i1Studio).

            **Just want to run it?** Download the file for your system:

            | System | File |
            |--------|------|
            | Windows | `chromiq-io-probe-windows.exe` |
            | macOS (Intel **and** Apple Silicon) | `chromiq-io-probe-macos` |
            | Linux | `chromiq-io-probe-linux` |

            No Python needed. **It changes nothing on the instrument or the
            computer**: it never sends anything to the instrument or the table,
            cannot move the i1iO's arm, and changes no settings. The optional
            recording only listens (on Windows through the free USBPcap, which
            you install yourself if you want to record).

            ### What's new in 1.5.4

            **Aimed at the next recording of an i1iO table.** The first real
            recording of an i1iO 2 (with an i1Pro 2, on a Mac) now exists.
            It showed that i1Profiler talks to the table in short lines of
            text through a common USB-to-serial chip, and every one of its
            2,475 lines passed the check number we worked out, so we very
            likely read the format correctly. Much is still unknown, and
            nothing is promised: ChromIQ cannot drive the table. There is
            still no recording from a handheld instrument.

            - **New i1iO steps**, the most useful first: one row of a chart
              that i1Profiler scans in one pass, while you mark when the arm
              starts (`a`), the lamp lights (`l`) and the head goes down and up
              (`d`, `u`), then a cancel; a few patches in spot mode (if
              offered); a small chart to the end with the fastest setting; one
              row with dual scan (if offered); one row of the earlier chart (if
              at hand). Then a few questions (chart files, paper size, a ruler
              measurement, the settings, the sheet hold).
            - The i1iO 3 (0765:30B0) is recognised as a table; its protocol is
              not known yet.
            - **On a Mac, every step is checked straight away** ("this step
              recorded 14 commands to the table: good", or "please repeat
              it"), and a table at the end says what is still missing, all
              while SIP is still off. A list of what to have ready comes
              before the recording, and a box with the exact steps to switch
              SIP back on (and `csrutil status` to check) comes last.
            - **`--rehearse`** shows every step without recording anything.
              On a Mac: `./chromiq-io-probe-macos --rehearse` in the Terminal.
            - **Fixed on Windows: the recording stopped at once** whenever
              USBPcap was installed (found in a real report): the tool made
              the recording file before USBPcap could, and USBPcap refuses to
              write into a file that already exists. If the start fails
              anyway, the report now holds everything needed to see why, and
              the tool offers to record by hand with Wireshark instead.
            - **Fixed:** on a Mac, `--analyze` left out everything the program
              sent to a device (it sits in a different part of a macOS
              recording). Found in the first real recording.
            - **`--analyze` reads the i1iO table's conversation:** every line,
              its check number, and what it most likely means, each with
              "certain", "likely" or "guess". The serial number is hidden.
            - Windows on ARM and the driver help are worded only as far as
              the evidence goes (nothing is claimed about the i1Pro 3 on ARM
              that nobody has tried; no unverified Device Manager names).
            - An independent review before the release found, and this
              release fixes: stray keys could end or start a step, a second
              Ctrl-C at the end could lose the step log, a stopped recorder
              was reported as "please repeat", and the SIP box also came when
              nothing was recorded.

            Tested: on a Mac with SIP on (recording not possible, as it
            should be), the timed steps, the rehearsal and the analysis, in a
            terminal of 80 columns; the analysis against the two real i1iO
            recordings (the same 1,125 and 1,350 lines as our separate
            decoder, every check number right). Not tested: a recording with
            SIP off, and a real table (we have none).

            ### What's new in 1.5.3

            Help with the step where both users so far got stuck, and one
            plain question instead of guessing what you want to do. Still
            untested with a real instrument and a real recording.

            - **"What would you like to do?"** After looking for your
              instruments the tool shows what is plugged in right now (with
              its driver on Windows) and asks: 1 record an i1iO table, 2
              record a handheld instrument, 3 just make the report, or `a` to
              look again after plugging something in. The suggestion comes
              only from what is plugged in now, so Enter is usually right.
              `--io` and `--i1pro` choose without asking.
            - **USBPcap missing: the tool can fetch and start its official
              installer, only after a yes.** It first says what USBPcap is
              (free, open-source, by its own author, not by us), that it
              installs a system driver, that one user reported a blue screen
              naming its driver on Windows 11 25H2 (USBPcap issue #146), and
              how to remove it. The download (`USBPcapSetup-1.5.4.0.exe` from
              USBPcap's GitHub release) goes into a new private folder and is
              checked against a SHA-256 fingerprint written into the tool,
              after the download and again just before the start; on any
              difference it is deleted and never started. A second yes starts
              the installer the normal, visible way, with Windows' own
              permission question. The tool never restarts the computer.
            - **Not administrator:** one offer to start the tool again as
              administrator through Windows' own question.
            - Every "no" or failure leads to the manual steps, as in 1.5.2.
            - Helper programs never read your keys or write into the window;
              a device Windows only remembers is no longer offered as
              plugged in; the "remembered" note no longer wraps at 80 columns.
            - An independent review before the release found, and this
              release fixes: a half-written installer could stay behind; the
              install steps were repeated after a successful install; Ctrl-C
              at the question took the suggestion instead of stopping; the
              installer was saved next to the tool (now a private folder).

            ### What was tested for real, and what was not

            For the first time the Windows exe was driven on a real Windows:
            Windows 11 Home 25H2 on ARM in a virtual machine (the x64 exe runs
            emulated), German, by an automated test (`tools/vm_test/`) plus
            two steps where Windows' permission window had to be answered:

            - double-click start; the window stays open at every ending
              (normal end, "just the report", choices 1 and 2, an error,
              a real Ctrl-C while it looks for devices) and closes on Enter; run from a console with output
              redirected it never waits;
            - the new question with nothing plugged in, "look again",
              choices 1, 2 and 3; an 80-column window; no garbled characters;
            - not administrator: the explanation before the steps, the offer,
              the real Windows permission window, and the copy started as
              administrator running;
            - USBPcap missing: the explanation, the real download from GitHub
              inside the virtual machine, a deliberately wrong fingerprint
              refused, the real permission window for USBPcap's installer
              (verified publisher "Tomasz Moń"), its licence page, and, after
              it was cancelled, the tool saying plainly that USBPcap is still
              not installed and cleaning up its download folder.

            Not tested: a real instrument, a real recording, USBPcap's driver
            actually installed (there is no USBPcap driver for Windows on ARM,
            so it was not installed), and an x64 Windows PC.

            ### What's new in 1.5.2

            Changed after the second report from a user: the window closed
            before the instructions could be read. Still untested with a real
            recording.

            - **The window stays open.** Double-clicked on Windows, the window
              closed the moment the tool finished, so its help vanished and it
              looked like a crash. Every ending (normal end, nothing recorded,
              q, Ctrl-C, an error) now finishes with "Press Enter to close this
              window." It waits only in a console window of its own; from a
              command window, piped, redirected or under CI it does not.
              `--pause` and `--no-pause` force it either way.
            - **WHAT TO DO NOW:** when USBPcap, administrator rights, X-Rite's
              driver or the instrument is missing, a short box with the next
              steps is the last thing on the screen, with the name and folder
              of the report that holds the full instructions. When USBPcap is
              missing it offers to open Wireshark's download page (only on a
              yes).
            - **Administrator rights are checked before the steps:** USBPcap
              lets only administrators listen to the USB ports, so the tool now
              says so first and explains how to start it as administrator,
              instead of letting the session begin.
            - **An unexpected error** says sorry, saves what was collected with
              the technical details, says where, and waits.
            - **i1Pro 2 on Windows 11 25H2 or newer:** when X-Rite's driver is
              installed and Windows reports the instrument as working, the tool
              says so and asks to carry on and tell us whether i1Profiler
              measures with it.

            ### What's new in 1.5.1

            Changed after the first report from a user. Still untested with a
            real recording.

            - **Clearer help when USBPcap is missing:** what it is, why it is
              needed, numbered install steps (Wireshark's "USB Capture" page,
              the restart, run the tool again), and that no security setting
              has to be switched off. When nothing could be recorded, the run
              now ends by saying so, with what to do, instead of "ALL DONE".
            - **The Windows 11 25H2 driver note only where it applies:** X-Rite
              says the i1Pro 2 / iO2 driver is blocked on 25H2 and newer, and
              that the i1Pro 3 works with the latest Windows 11 releases.
            - **A new check for the instrument's driver:** on the ArgyllCMS
              driver (as ArgyllCMS, ChromIQ or Zadig install it) the vendor
              program cannot see the instrument. The tool says how to give it
              X-Rite's driver back, and how to switch back for ChromIQ later.
            - **Original i1Pro:** X-Rite removed revisions A to D from
              i1Profiler in 3.2.0 (3.1.1 is needed); with both an i1Pro and an
              i1Pro 2, plug in only the one you record.
            - Devices Windows only remembers no longer count as plugged in;
              chart names containing "Studio" are no longer tagged as iO charts.

            ### What's new in 1.5

            - **A guided recording session for handheld instruments.** When the
              tool sees an i1Pro, i1Pro 2, i1Pro 3, ColorMunki or i1Studio and no
              i1iO, it offers it (or start it with `--i1pro`). Up to nine short
              steps in the program you normally measure with (i1Profiler,
              ccStudio, the ColorMunki or i1Studio software): idle, calibrate,
              one strip, the same strip in dual scan, faster, slower, a scan
              that fails on purpose, one single patch, and without the ruler.
              Each step goes into its own file; skip, repeat or stop at any time
              without losing finished steps. After each step you note what
              happened and what the instrument's lights did.
            - **What it records:** the USB conversation between the program and
              the instrument, which necessarily includes the instrument's serial
              number and calibration data (the tool says so first). Only the
              instrument's own traffic goes into the folder you would send;
              nothing is uploaded, you send it yourself if you want to: in
              the forum thread where you heard about the tool, as a new
              issue, or in a private message on the forum.
            - **Windows checks first (read only):** Windows version, USBPcap,
              administrator rights, which USB port group the instrument is on,
              installed programs and versions. Facts, not obstacles:
              i1Profiler 3.8.7 dropped the i1Pro 2 (3.8.6 or older needed);
              X-Rite says the i1Pro 2 driver is blocked on Windows 11 25H2 and
              newer; no driver on Windows on ARM.
            - **`--analyze` reads Windows and Linux recordings too**, decodes the
              commands of the i1Pro family and the ColorMunki / i1Studio from the
              facts ArgyllCMS documents, and says in plain words whether a
              recording holds what is needed.

            > **Nothing is promised.** A recording helps us understand how the
            > vendor programs drive these instruments. Whether an open-source
            > measurement engine can ever use what we learn is a separate
            > question, and the answer may be no.

            ### What has NOT been tested

            - **Any recording of a real instrument.** No i1Pro, i1Pro 2, i1Pro 3,
              ColorMunki or i1Studio was available while building 1.5 and 1.5.1, and no
              i1iO for 1.4. Everything about real instrument traffic is untested;
              the analyser was tested with synthetic recordings built from the
              formats ArgyllCMS documents.
            - **The recording on a real Windows PC.** It was tested with a
              stand-in for USBPcap's recorder; the Windows checks were tested
              against text written from the documented formats.
            - Any recording on a Mac with SIP switched off.

            > **Owners of an i1Pro 2 or an i1iO 2:** i1Profiler 3.8.7 (July 2026)
            > removed support for both. Stay on i1Profiler 3.8.6 or older and do
            > not let it update itself.

            ### Running it on macOS or Linux

            Downloaded files aren't marked as runnable, and macOS refuses
            unsigned programs. The reliable way: open Terminal and run

            ```bash
            cd ~/Downloads
            chmod +x chromiq-io-probe-macos      # or chromiq-io-probe-linux
            xattr -d com.apple.quarantine chromiq-io-probe-macos   # macOS only
            ./chromiq-io-probe-macos
            ```

            `chmod +x` marks the file as runnable; the `xattr` line removes
            the "downloaded from the internet" mark that makes macOS refuse
            it; the last line starts it. In Finder on macOS 15 and newer:
            double-click once, then **System Settings > Privacy & Security >
            Open Anyway**, and **Open**. On **Windows** simply double-click the
            `.exe` and choose **More info**, then **Run anyway** (right-click,
            **Run as administrator** for a recording).

            These builds are **not code-signed** (that needs a paid
            certificate), so your system will warn you once. That's expected.
            On macOS you may also need **System Settings > Privacy & Security >
            Open Anyway**. See the README for what the tool collects.

            Prefer to read the source before running? Grab
            `chromiq-i1io-probe-scripts.zip` instead.

            ---
            ☕ ChromIQ is free and always will be. If it's useful to you, a coffee is a kind way to say thanks. It is completely optional, and the app stays fully featured either way.

